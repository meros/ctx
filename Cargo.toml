[package]
name = "ctx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Context gatherer CLI for AI-assisted planning phases"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ignore = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# AST parsing via tree-sitter
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
